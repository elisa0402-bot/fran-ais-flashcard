<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>프랑스어 SRS 플래시카드 앱</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .flipped { transform: rotateY(180deg); }
    body { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center select-none pb-8">

  <!-- Header -->
  <header class="w-full max-w-md bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="flex justify-between items-center">
      <h1 class="text-base font-bold flex items-center gap-2">
        <span>🇫🇷</span> 프랑스어 플래시카드
      </h1>
      <div class="flex gap-1.5">
        <button id="btn-tab-study" onclick="switchTab('study')" class="px-3 py-1.5 bg-indigo-900 text-white rounded-lg text-xs font-semibold transition shadow-sm">카드 학습</button>
        <button id="btn-tab-list" onclick="switchTab('list')" class="px-3 py-1.5 bg-indigo-500 text-white rounded-lg text-xs font-semibold transition shadow-sm">전체 목록</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="w-full max-w-md p-4 flex-1 flex flex-col gap-3">

    <!-- Progress Bar & Top Tools -->
    <section class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 flex justify-between items-center text-xs">
      <div>
        <span class="text-slate-400 font-medium">학습 카드: </span>
        <span id="card-progress-text" class="font-bold text-indigo-600">1 / 130</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleStarCurrentCard()" id="btn-star" class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-400 hover:text-amber-500 transition flex items-center gap-1 font-medium text-xs">
          <i class="fa-solid fa-star"></i> <span id="star-btn-label">즐겨찾기</span>
        </button>
        <button onclick="shuffleDeck()" class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition font-medium text-xs flex items-center gap-1" title="카드 무작위 섞기">
          <i class="fa-solid fa-shuffle"></i> 섞기
        </button>
        <button onclick="shareCurrentCard()" class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition font-medium text-xs flex items-center gap-1" title="현재 카드 공유하기">
          <i class="fa-solid fa-share-nodes"></i> 공유
        </button>
      </div>
    </section>

    <!-- Study View -->
    <div id="tab-study" class="flex-1 flex flex-col justify-between gap-3">
      
      <!-- Category Filter Pills -->
      <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button onclick="filterCategory('all')" id="cat-all" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-indigo-600 text-white shadow-xs whitespace-nowrap">전체 (249)</button>
        <button onclick="filterCategory('starred')" id="cat-starred" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">⭐ 즐겨찾기</button>
        <button onclick="filterCategory('pc')" id="cat-pc" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">복합과거</button>
        <button onclick="filterCategory('imparfait')" id="cat-imparfait" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">반과거</button>
        <button onclick="filterCategory('futur')" id="cat-futur" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">단순미래</button>
        <button onclick="filterCategory('pdf30')" id="cat-pdf30" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-amber-50 text-amber-700 border border-amber-200 whitespace-nowrap">PDF 핵심 30문장</button>
        <button onclick="filterCategory('comparatif')" id="cat-comparatif" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">비교급</button>
        <button onclick="filterCategory('relatif')" id="cat-relatif" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">관계대명사</button>
        <button onclick="filterCategory('participe')" id="cat-participe" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">현재분사·제롱디프</button>
        <button onclick="filterCategory('inclusive')" id="cat-inclusive" class="cat-btn px-3 py-1.5 rounded-full font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">écriture inclusive</button>
      </div>

      <!-- Direction Toggle Switcher -->
      <div class="flex justify-between items-center bg-white px-3 py-2 rounded-xl border border-slate-200 text-xs shadow-2xs">
        <span class="font-medium text-slate-500">학습 방향</span>
        <button onclick="toggleDirection()" class="px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-lg transition border border-indigo-200 flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate text-xs"></i>
          <span id="direction-label">프랑스어 ➔ 한국어</span>
        </button>
      </div>

      <!-- Flashcard Interactive Container -->
      <div id="card-container" class="relative w-full h-80 perspective-1000 my-auto">
        <div id="flashcard" class="w-full h-full transform-style-3d transition-transform duration-500 relative cursor-pointer rounded-2xl shadow-sm border border-slate-200 bg-white" onclick="flipCard()">
          
          <!-- Front Face -->
          <div id="card-front" class="absolute w-full h-full backface-hidden flex flex-col justify-between p-5 rounded-2xl bg-white">
            <div class="flex justify-between items-center text-xs text-slate-400">
              <div class="flex items-center gap-1.5">
                <span id="front-category" class="px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 font-semibold text-[10px]">복합과거</span>
                <span id="front-starred-icon" class="text-amber-400 hidden"><i class="fa-solid fa-star"></i></span>
              </div>
              <span class="text-[11px]"><i class="fa-solid fa-rotate-right mr-1"></i>터치하여 뒤집기</span>
            </div>
            
            <div class="text-center my-auto px-2">
              <h2 id="front-main" class="text-2xl font-bold text-slate-800 break-words mb-1">--</h2>
              <p id="front-sub" class="text-xs text-indigo-600 font-medium italic">--</p>
            </div>

            <div class="flex justify-end">
              <button onclick="speakCurrentCard(event, 'front')" class="p-3 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-full transition active:scale-95 shadow-2xs" title="원어민 발음 듣기">
                <i class="fa-solid fa-volume-high text-lg"></i>
              </button>
            </div>
          </div>

          <!-- Back Face -->
          <div id="card-back" class="absolute w-full h-full backface-hidden rotate-y-180 flex flex-col justify-between p-5 rounded-2xl bg-slate-50 border-2 border-indigo-100">
            <div class="flex justify-between items-center text-xs text-slate-400">
              <span id="back-category" class="px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 font-semibold text-[10px]">답안</span>
              <button onclick="speakCurrentCard(event, 'back')" class="p-2 text-indigo-600 bg-white rounded-full shadow-2xs transition active:scale-95" title="발음 듣기">
                <i class="fa-solid fa-volume-high text-base"></i>
              </button>
            </div>

            <div class="my-auto space-y-3 overflow-y-auto max-h-[200px] pr-1">
              <h3 id="back-main" class="text-lg font-bold text-slate-900 text-center break-words">--</h3>
              
              <!-- Examples -->
              <div id="back-examples" class="text-xs space-y-2 border-t pt-2 border-slate-200"></div>

              <p id="back-tip" class="text-[11px] bg-amber-50 text-amber-800 p-2 rounded-lg border border-amber-200 italic hidden"></p>
            </div>

            <div class="text-center text-[10px] text-slate-400">좌우 버튼으로 다음/이전 카드로 이동합니다</div>
          </div>

        </div>
      </div>

      <!-- Navigation Control Buttons -->
      <div id="action-buttons" class="grid grid-cols-2 gap-3 mt-auto">
        <button onclick="prevCard()" class="py-3 bg-white active:bg-slate-100 text-slate-700 font-bold rounded-xl shadow-sm border border-slate-200 transition active:scale-95 flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-chevron-left text-xs"></i> 이전 카드
        </button>
        <button onclick="nextCard()" class="py-3 bg-indigo-600 active:bg-indigo-700 text-white font-bold rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm">
          다음 카드 <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <!-- Empty State View -->
      <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center p-6 bg-white rounded-2xl border border-slate-200 shadow-sm my-auto min-h-[280px]">
        <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-2"></i>
        <h3 class="text-base font-bold text-slate-800">카드가 없습니다</h3>
        <p class="text-xs text-slate-500 mt-1">선택한 카테고리(또는 즐겨찾기)에 해당하는 카드가 없습니다.</p>
        <button onclick="filterCategory('all')" class="mt-4 px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl transition">전체 카드 보기</button>
      </div>

    </div>

    <!-- Search/List View Tab -->
    <div id="tab-list" class="hidden flex-1 flex flex-col gap-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
        <input id="search-input" oninput="renderListView()" type="text" placeholder="프랑스어, 뜻, 예문 검색..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500">
      </div>

      <div id="card-list" class="flex-1 overflow-y-auto space-y-2 max-h-[65vh] pr-0.5">
        <!-- List Items populated dynamically -->
      </div>
    </div>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-msg">클립보드에 복사되었습니다!</span>
  </div>

  <script>
    const initialFlashcards = [
      // =========================================================================
      // PART 1. 복합과거 (Passé Composé)
      // =========================================================================
      {
        id: 1,
        category: "pc",
        target: "le garage",
        pos: "명사 (m.)",
        meaning: "차고",
        examples: [
          { target: "J'ai sorti ma voiture du garage.", kr: "나는 차고에서 내 차를 뺐다. (타동사/avoir)" }
        ],
        tip: "sortir가 타동사(직접목적어 ma voiture)로 쓰였으므로 avoir 조동사를 사용합니다."
      },
      {
        id: 2,
        category: "pc",
        target: "un arbre",
        pos: "명사 (m.)",
        meaning: "나무",
        examples: [
          { target: "Elles sont montées sur un arbre.", kr: "그녀들은 나무 위에 올라갔다. (자동사/être)" }
        ],
        tip: "monter가 장소 전치사와 함께 자동사로 쓰여 être 조동사를 사용하고 성수일치(-es)가 이루어집니다."
      },
      {
        id: 3,
        category: "pc",
        target: "le bureau",
        pos: "명사 (m.)",
        meaning: "사무실, 책상",
        examples: [
          { target: "J'ai quitté le bureau à 18h.", kr: "나는 18시에 사무실을 떠났다." }
        ],
        tip: "quitter는 직접목적어(장소/사람)를 받는 타동사입니다."
      },
      {
        id: 4,
        category: "pc",
        target: "un étage",
        pos: "명사 (m.)",
        meaning: "층",
        examples: [
          { target: "Je suis monté(e) jusqu'au troisième étage.", kr: "나는 3층까지 올라갔다." }
        ],
        tip: "monter 자동사 용법입니다."
      },
      {
        id: 5,
        category: "pc",
        target: "le store",
        pos: "명사 (m.)",
        meaning: "블라인드, 커튼",
        examples: [
          { target: "Tu as descendu les stores.", kr: "너는 블라인드를 내렸다. (타동사/avoir)" }
        ],
        tip: "descendre 뒤에 직접목적어(les stores)가 오므로 avoir 조동사를 사용합니다."
      },
      {
        id: 6,
        category: "pc",
        target: "la fille / le fils",
        pos: "명사 (f. / m.)",
        meaning: "딸 / 아들",
        examples: [
          { target: "J'ai vu les filles.", kr: "나는 그 소녀들을 보았다." },
          { target: "Ma fille s'est cassé le bras en faisant du ski.", kr: "내 딸은 스키를 타다가 팔이 부러졌다." }
        ],
        tip: "fils는 단수/복수 형태가 같으며 '스' 발음이 납니다 [fis]."
      },
      {
        id: 7,
        category: "pc",
        target: "la sœur / le frère",
        pos: "명사 (f. / m.)",
        meaning: "자매 / 형제·남동생",
        examples: [
          { target: "J'ai remercié ma sœur.", kr: "나는 내 누나(여동생)에게 감사했다." },
          { target: "Elle s'est demandé si son frère était à la maison.", kr: "그녀는 남동생이 집에 있는지 스스로 물었다." }
        ],
        tip: "복합과거 문장 참조."
      },
      {
        id: 8,
        category: "pc",
        target: "le magasin",
        pos: "명사 (m.)",
        meaning: "상점, 가게",
        examples: [
          { target: "Ils sont passés devant le magasin.", kr: "그들은 상점 앞을 지나갔다." }
        ],
        tip: "passer가 '지나가다' 자동사로 쓰여 être 조동사를 사용합니다."
      },
      {
        id: 9,
        category: "pc",
        target: "le marché",
        pos: "명사 (m.)",
        meaning: "시장",
        examples: [
          { target: "Nous sommes allés au marché.", kr: "우리는 시장에 갔다." }
        ],
        tip: "왕래발착 동사 aller는 être 조동사를 사용합니다."
      },
      {
        id: 10,
        category: "pc",
        target: "partir, sortir, descendre, venir de VS quitter qc/qn",
        pos: "동사 비교",
        meaning: "출발·외출·하강·~에서 오다 (자동사) VS ~을 떠나다 (타동사)",
        examples: [
          { target: "Elle est partie en Italie.", kr: "그녀는 이탈리아로 떠났다. (être)" },
          { target: "J'ai quitté le bureau.", kr: "나는 사무실을 떠났다. (avoir + 직목)" }
        ],
        tip: "왕래발착 자동사들은 être, quitter는 목적어를 취하는 타동사이므로 avoir를 씁니다."
      },
      {
        id: 11,
        category: "pc",
        target: "retourner à sa place",
        pos: "표현 (복합과거)",
        meaning: "제자리로 돌아가다",
        examples: [
          { target: "Elle est retournée à sa place.", kr: "그녀는 제자리로 돌아갔다. (자동사)" },
          { target: "Les filles sont retournées à leur place.", kr: "소녀들은 자신들의 자리로 돌아갔다." }
        ],
        tip: "장소로 돌아가는 자동사 용법에서는 être 조동사 및 주어 성수일치 필수!"
      },
      {
        id: 12,
        category: "pc",
        target: "le plus vite possible",
        pos: "부사구",
        meaning: "가능한 한 가장 빠르게",
        examples: [
          { target: "Tu es retourné(e) à l'église le plus vite possible.", kr: "너는 가능한 한 빨리 교회로 돌아갔다." }
        ],
        tip: "복합과거 예문 참조."
      },
      {
        id: 13,
        category: "pc",
        target: "remercier qn",
        pos: "동사 (복합과거 선행 직목 일치)",
        meaning: "~에게 감사하다 (직접목적어 취함)",
        examples: [
          { target: "J'ai remercié ma sœur. ➔ Je l'ai remerciée.", kr: "나는 누나에게 감사했다. ➔ 나는 그녀에게 감사했다." }
        ],
        tip: "remercier는 불어에서 직접목적보어를 취하므로 대명사 l'가 선행하면 p.p 일치(-e)가 일어납니다."
      },
      {
        id: 14,
        category: "pc",
        target: "appeler qn",
        pos: "동사 (복합과거 선행 직목 일치)",
        meaning: "~를 부르다, ~에게 전화하다 (직접목적어)",
        examples: [
          { target: "Tu as appelé Julie ce soir ? ➔ Tu l'as appelée ce soir ?", kr: "너 오늘 저녁 줄리에게 전화했니? ➔ 너 오늘 저녁 그녀에게 전화했니?" }
        ],
        tip: "appeler 역시 직접목적어를 취하여 대명사 도치 시 p.p 일치(-e)가 이루어집니다."
      },
      {
        id: 15,
        category: "pc",
        target: "inviter qn",
        pos: "동사 (복합과거 선행 직목 일치)",
        meaning: "~를 초대하다 (직접목적어)",
        examples: [
          { target: "Je vous ai invité(e)s à la fête.", kr: "나는 당신들을 파티에 초대했습니다." }
        ],
        tip: "Je vous invite ➔ 복합과거에서 vous가 직접목적어이면 p.p 일치!"
      },
      {
        id: 16,
        category: "pc",
        target: "présenter qn à qn",
        pos: "동사 (복합과거 선행 직목 일치)",
        meaning: "~를 …에게 소개하다",
        examples: [
          { target: "Elle vous a présenté(e)s à eux.", kr: "그녀는 당신들을 그들에게 소개했습니다." }
        ],
        tip: "직접목적어 vous가 선행했으므로 présenté에 성수일치 합니다."
      },
      {
        id: 17,
        category: "pc",
        target: "avant de + inf / avant + N",
        pos: "전치사 표현",
        meaning: "~하기 전에 / ~ 전에",
        examples: [
          { target: "Elle s'est lavée avant de dormir.", kr: "그녀는 자기 전에 씻었다." },
          { target: "Elles se sont lavées avant le petit déjeuner.", kr: "그녀들은 아침 식사 전에 씻었다." }
        ],
        tip: "avant de 뒤에는 동사원형, avant 뒤에는 명사가 옵니다."
      },
      {
        id: 18,
        category: "pc",
        target: "le bras",
        pos: "명사 (m.)",
        meaning: "팔",
        examples: [
          { target: "Elles se sont blessé le bras.", kr: "그녀들은 팔을 다쳤다." },
          { target: "Ma fille s'est cassé le bras.", kr: "내 딸은 팔이 부러졌다." }
        ],

    let currentDeck = [];
    let currentCardIndex = 0;
    let isFlipped = false;
    let isForeignToKr = true;
    let activeCategory = 'all';
    let starredCardIds = new Set();
    let frenchVoice = null;

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      frenchVoice = voices.find(v => v.lang === 'fr-FR' || v.lang === 'fr_FR') || 
                    voices.find(v => v.lang.startsWith('fr')) || null;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function playTTS(text, isFrench = true) {
      if (!('speechSynthesis' in window) || !text) return;
      let cleanText = text.replace(/➔.*/g, '').replace(/\[.*?\]/g, '').trim();

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(cleanText);

      if (isFrench) {
        utterance.lang = 'fr-FR';
        if (frenchVoice) utterance.voice = frenchVoice;
        utterance.rate = 0.85;
      } else {
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
      }

      window.speechSynthesis.speak(utterance);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadFavorites();
      buildDeck();
      renderCurrentCard();
      renderListView();
    });

    function loadFavorites() {
      const stored = localStorage.getItem('french_flashcard_stars');
      if (stored) {
        try {
          starredCardIds = new Set(JSON.parse(stored));
        } catch(e) {
          starredCardIds = new Set();
        }
      }
    }

    function saveFavorites() {
      localStorage.setItem('french_flashcard_stars', JSON.stringify([...starredCardIds]));
    }

    function buildDeck() {
      currentDeck = initialFlashcards.filter(card => {
        if (activeCategory === 'starred') return starredCardIds.has(card.id);
        if (activeCategory === 'all') return true;
        return card.category === activeCategory;
      });
      currentCardIndex = 0;
      isFlipped = false;
    }

    function filterCategory(category) {
      activeCategory = category;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white', 'bg-amber-500');
        btn.classList.add('bg-white', 'text-slate-600');
      });
      const activeBtn = document.getElementById(`cat-${category}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-slate-600');
        activeBtn.classList.add(category === 'pdf30' ? 'bg-amber-500' : 'bg-indigo-600', 'text-white');
      }
      buildDeck();
      renderCurrentCard();
    }

    function shuffleDeck() {
      if (currentDeck.length <= 1) return;
      for (let i = currentDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
      }
      currentCardIndex = 0;
      isFlipped = false;
      renderCurrentCard();
    }

    function renderCurrentCard() {
      const container = document.getElementById('card-container');
      const actionBtns = document.getElementById('action-buttons');
      const emptyState = document.getElementById('empty-state');
      const cardElem = document.getElementById('flashcard');

      cardElem.classList.remove('flipped');
      isFlipped = false;

      if (currentDeck.length === 0) {
        container.classList.add('hidden');
        actionBtns.classList.add('hidden');
        emptyState.classList.remove('hidden');
        document.getElementById('card-progress-text').innerText = `0 / 0`;
        updateStarButtonUI(false);
        return;
      }

      container.classList.remove('hidden');
      actionBtns.classList.remove('hidden');
      emptyState.classList.add('hidden');

      const card = currentDeck[currentCardIndex];
      const isStarred = starredCardIds.has(card.id);

      document.getElementById('card-progress-text').innerText = `${currentCardIndex + 1} / ${currentDeck.length}`;
      updateStarButtonUI(isStarred);

      const catLabels = {
        pc: "복합과거 (P.C.)",
        imparfait: "반과거 (Imparfait)",
        futur: "단순미래 (Futur)",
        pdf30: "PDF 핵심 30문장",
        comparatif: "비교급",
        relatif: "관계대명사",
        participe: "현재분사·제롱디프",
        inclusive: "écriture inclusive"
      };
      
      document.getElementById('front-category').innerText = catLabels[card.category] || "일반";
      document.getElementById('front-starred-icon').classList.toggle('hidden', !isStarred);

      const exContainer = document.getElementById('back-examples');
      exContainer.innerHTML = '';

      if (isForeignToKr) {
        document.getElementById('front-main').innerText = card.target;
        document.getElementById('front-sub').innerText = card.pos ? `[${card.pos}]` : '';
        document.getElementById('back-main').innerText = card.meaning;

        if (card.examples && card.examples.length > 0) {
          card.examples.forEach((ex, idx) => {
            const item = document.createElement('div');
            item.className = 'bg-white p-2 rounded-lg border border-slate-100 shadow-2xs flex justify-between items-center';
            item.innerHTML = `
              <div>
                <p class="font-semibold text-slate-800 text-xs">${idx + 1}. ${ex.target}</p>
                <p class="text-slate-500 text-[11px] mt-0.5">${ex.kr}</p>
              </div>
              <button onclick="speakTextCustom(event, '${escapeQuotes(ex.target)}', true)" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="발음 듣기">
                <i class="fa-solid fa-volume-high text-xs"></i>
              </button>
            `;
            exContainer.appendChild(item);
          });
        }
      } else {
        document.getElementById('front-main').innerText = card.meaning;
        document.getElementById('front-sub').innerText = card.pos ? `[구분: ${card.pos}]` : '';
        document.getElementById('back-main').innerText = card.target;

        if (card.examples && card.examples.length > 0) {
          card.examples.forEach((ex, idx) => {
            const item = document.createElement('div');
            item.className = 'bg-white p-2 rounded-lg border border-slate-100 shadow-2xs flex justify-between items-center';
            item.innerHTML = `
              <div>
                <p class="font-semibold text-slate-800 text-xs">${idx + 1}. ${ex.kr}</p>
                <p class="text-indigo-600 font-medium text-[11px] mt-0.5">➔ ${ex.target}</p>
              </div>
              <button onclick="speakTextCustom(event, '${escapeQuotes(ex.target)}', true)" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="발음 듣기">
                <i class="fa-solid fa-volume-high text-xs"></i>
              </button>
            `;
            exContainer.appendChild(item);
          });
        }
      }

      const tipElem = document.getElementById('back-tip');
      if (card.tip) {
        tipElem.innerText = `💡 문법 Tip: ${card.tip}`;
        tipElem.classList.remove('hidden');
      } else {
        tipElem.classList.add('hidden');
      }
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function flipCard() {
      const cardElem = document.getElementById('flashcard');
      isFlipped = !isFlipped;
      cardElem.classList.toggle('flipped', isFlipped);
    }

    function nextCard() {
      if (currentDeck.length === 0) return;
      currentCardIndex = (currentCardIndex + 1) % currentDeck.length;
      renderCurrentCard();
    }

    function prevCard() {
      if (currentDeck.length === 0) return;
      currentCardIndex = (currentCardIndex - 1 + currentDeck.length) % currentDeck.length;
      renderCurrentCard();
    }

    function toggleStarCurrentCard() {
      if (currentDeck.length === 0) return;
      const card = currentDeck[currentCardIndex];
      if (starredCardIds.has(card.id)) {
        starredCardIds.delete(card.id);
      } else {
        starredCardIds.add(card.id);
      }
      saveFavorites();
      renderCurrentCard();
      renderListView();
    }

    function updateStarButtonUI(isStarred) {
      const btn = document.getElementById('btn-star');
      const label = document.getElementById('star-btn-label');
      if (isStarred) {
        btn.className = "px-2.5 py-1 rounded-lg bg-amber-500 text-white font-medium text-xs flex items-center gap-1 shadow-xs transition";
        label.innerText = "즐겨찾기됨";
      } else {
        btn.className = "px-2.5 py-1 rounded-lg border border-slate-200 text-slate-500 hover:text-amber-500 transition flex items-center gap-1 font-medium text-xs";
        label.innerText = "즐겨찾기";
      }
    }

    function toggleDirection() {
      isForeignToKr = !isForeignToKr;
      document.getElementById('direction-label').innerText = isForeignToKr ? "프랑스어 ➔ 한국어" : "한국어 ➔ 프랑스어";
      renderCurrentCard();
    }

    function speakCurrentCard(event, face) {
      event.stopPropagation();
      if (currentDeck.length === 0) return;
      const card = currentDeck[currentCardIndex];

      let text = "";
      let isFrench = true;

      if (isForeignToKr) {
        text = (face === 'front') ? card.target : card.meaning;
        isFrench = (face === 'front');
      } else {
        text = (face === 'front') ? card.meaning : card.target;
        isFrench = (face === 'back');
      }

      playTTS(text, isFrench);
    }

    function speakTextCustom(event, text, isFrench) {
      event.stopPropagation();
      playTTS(text, isFrench);
    }

    function switchTab(tab) {
      const studyTab = document.getElementById('tab-study');
      const listTab = document.getElementById('tab-list');
      const studyBtn = document.getElementById('btn-tab-study');
      const listBtn = document.getElementById('btn-tab-list');

      if (tab === 'study') {
        studyTab.classList.remove('hidden');
        listTab.classList.add('hidden');
        studyBtn.className = "px-3 py-1.5 bg-indigo-900 text-white rounded-lg text-xs font-semibold transition shadow-sm";
        listBtn.className = "px-3 py-1.5 bg-indigo-500 text-white rounded-lg text-xs font-semibold transition shadow-sm";
      } else {
        studyTab.classList.add('hidden');
        listTab.classList.remove('hidden');
        listBtn.className = "px-3 py-1.5 bg-indigo-900 text-white rounded-lg text-xs font-semibold transition shadow-sm";
        studyBtn.className = "px-3 py-1.5 bg-indigo-500 text-white rounded-lg text-xs font-semibold transition shadow-sm";
      }
    }

    function renderListView() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const listContainer = document.getElementById('card-list');
      listContainer.innerHTML = '';

      const filtered = initialFlashcards.filter(c => 
        c.target.toLowerCase().includes(query) || 
        c.meaning.toLowerCase().includes(query) ||
        (c.tip && c.tip.toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">검색 결과가 없습니다.</div>`;
        return;
      }

      filtered.forEach(c => {
        const isStarred = starredCardIds.has(c.id);
        const item = document.createElement('div');
        item.className = 'bg-white p-3 rounded-xl border border-slate-200 shadow-2xs flex justify-between items-center gap-2';
        item.innerHTML = `
          <div class="flex-1 pr-1">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-bold text-slate-800 text-xs">${c.target}</span>
              <span class="text-[10px] text-slate-400">[${c.pos || '단어'}]</span>
            </div>
            <p class="text-[11px] text-slate-500 mt-0.5">${c.meaning}</p>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="speakTextCustom(event, '${escapeQuotes(c.target)}', true)" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition text-xs" title="발음 듣기">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="toggleStarList(${c.id})" class="p-2 ${isStarred ? 'text-amber-500' : 'text-slate-300'} hover:text-amber-500 transition text-xs">
              <i class="fa-solid fa-star"></i>
            </button>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function toggleStarList(id) {
      if (starredCardIds.has(id)) {
        starredCardIds.delete(id);
      } else {
        starredCardIds.add(id);
      }
      saveFavorites();
      renderListView();
      if (activeCategory === 'starred') {
        buildDeck();
        renderCurrentCard();
      }
    }

    function shareCurrentCard() {
      if (currentDeck.length === 0) return;
      const card = currentDeck[currentCardIndex];
      
      let textToShare = `🇫🇷 [프랑스어 플래시카드]\n• 단어/문장: ${card.target}\n• 뜻: ${card.meaning}`;
      if (card.pos) textToShare += ` (${card.pos})`;
      if (card.examples && card.examples.length > 0) {
        textToShare += `\n• 예문: ${card.examples[0].target} (${card.examples[0].kr})`;
      }
      if (card.tip) {
        textToShare += `\n• 💡 문법 Tip: ${card.tip}`;
      }

      if (navigator.share) {
        navigator.share({
          title: '프랑스어 플래시카드',
          text: textToShare
        }).catch(() => copyToClipboard(textToShare));
      } else {
        copyToClipboard(textToShare);
      }
    }

    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        showToast('카드 내용이 클립보드에 복사되었습니다!');
      } catch (err) {
        showToast('복사에 실패했습니다.');
      } finally {
        document.body.removeChild(textarea);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      if (!toast || !toastMsg) return;
      
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
</body>
